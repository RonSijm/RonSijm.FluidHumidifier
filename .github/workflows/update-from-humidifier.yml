name: Update from Humidifier

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout FluidHumidifier
      uses: actions/checkout@v7
    - name: Checkout Humidifier
      uses: actions/checkout@v7
      with:
        repository: RonSijm/RonSijm.Humidifier
        path: upstream-humidifier
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: src/global.json
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: src-dotnet11/global.json
    - name: Update each source track from the matching Humidifier track
      shell: bash
      env:
        HumidifierRepositoryRoot: ${{ github.workspace }}/upstream-humidifier
      run: |
        for SOURCE in src src-dotnet11; do
          UPSTREAM="$GITHUB_WORKSPACE/upstream-humidifier/$SOURCE"
          VERSION="$(cat "$UPSTREAM/version.txt").$(tr -d '.' < "$UPSTREAM/spec-version.txt")"
          if [ -f "$UPSTREAM/version-suffix.txt" ]; then VERSION="$VERSION-$(cat "$UPSTREAM/version-suffix.txt")"; fi
          if [ "$(cat "$SOURCE/humidifier-version.txt")" = "$VERSION" ]; then continue; fi
          FRAMEWORK=net10.0
          if [ "$SOURCE" = src-dotnet11 ]; then FRAMEWORK=net11.0; fi
          (
            cd "$SOURCE"
            dotnet run --project RonSijm.FluidHumidifier.CodeGen -c Release -f "$FRAMEWORK" --no-launch-profile -- -ForceRegenerate -NoUpdateCheck -directory "$UPSTREAM"
            printf '%s\n' "$VERSION" > humidifier-version.txt
            cp "$UPSTREAM/spec-version.txt" humidifier-spec-version.txt
            dotnet restore RonSijm.FluidHumidifier -p:UseHumidifierProjectReference=false
            dotnet build RonSijm.FluidHumidifier -c Release --no-restore -p:UseHumidifierProjectReference=false -p:GeneratePackageOnBuild=false
          )
        done
    - name: Commit updates to both tracks
      shell: bash
      run: |
        git config user.email "RonSijm@Github.Action"
        git config user.name "Ron Sijm"
        git add src src-dotnet11
        if git diff --cached --quiet; then
          echo "No upstream changes to commit. Package versions will still be checked."
        else
          git commit -m "Automated update from Humidifier"
          git push origin main
        fi

  publish:
    needs: update
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-and-publish-nuget.yml

name: Publish NuGet Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        source: [src, src-dotnet11]
    defaults:
      run:
        working-directory: ${{ matrix.source }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.ref_name }}

    - name: Check for unpublished package versions
      id: package_version
      shell: bash
      run: |
        VERSION="$(cat version.txt).$(tr -d '.' < humidifier-spec-version.txt)"
        if [ -f version-suffix.txt ]; then VERSION="$VERSION-$(cat version-suffix.txt)"; fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        PUBLISH=false
        for PACKAGE in RonSijm.FluidHumidifier; do
          PACKAGE_ID="${PACKAGE,,}"
          URL="https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID/${VERSION,,}/$PACKAGE_ID.nuspec"
          STATUS=$(curl --silent --show-error --location --head --retry 3 --connect-timeout 15 --max-time 60 --output /dev/null --write-out '%{http_code}' "$URL")
          case "$STATUS" in
            200) echo "$PACKAGE $VERSION is already published." ;;
            404) echo "$PACKAGE $VERSION needs publishing."; PUBLISH=true ;;
            *) echo "::error::Could not check $PACKAGE $VERSION on NuGet (HTTP $STATUS)."; exit 1 ;;
          esac
        done
        echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

    - name: Set up the SDK for this source track
      if: steps.package_version.outputs.publish == 'true'
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: ${{ matrix.source }}/global.json

    - name: Build NuGet packages
      if: steps.package_version.outputs.publish == 'true'
      env:
        VERSION: ${{ steps.package_version.outputs.version }}
      shell: bash
      run: |
        dotnet restore RonSijm.FluidHumidifier/RonSijm.FluidHumidifier.csproj -p:UseHumidifierProjectReference=false
        dotnet pack RonSijm.FluidHumidifier/RonSijm.FluidHumidifier.csproj -c Release --no-restore -p:UseHumidifierProjectReference=false -p:PackageVersion="$VERSION" -p:Version="$VERSION" -p:GeneratePackageOnBuild=false -o "$GITHUB_WORKSPACE/packages/${{ matrix.source }}"

    - name: Log in to NuGet with trusted publishing
      if: steps.package_version.outputs.publish == 'true'
      id: login
      uses: NuGet/login@v1
      with:
        user: Ron.Sijm

    - name: Publish to NuGet
      if: steps.package_version.outputs.publish == 'true'
      run: dotnet nuget push "$GITHUB_WORKSPACE/packages/${{ matrix.source }}/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
